server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /var/lib/promtail/positions.yml

clients:
  # VictoriaLogs (default) — accepts Loki-compatible push at /insert/loki/api/v1/push
  - url: ${VL_PUSH_URL}

  # Loki (legacy) — remove after full migration

scrape_configs:
  - job_name: auth
    static_configs:
      - targets: [localhost]
        labels:
          instansi: ${ORG_LABEL}
          host: ${HOSTNAME}
          server_ip: ${SERVER_IP}
          job: auth
          __path__: /var/log/auth.log

  - job_name: syslog
    static_configs:
      - targets: [localhost]
        labels:
          instansi: ${ORG_LABEL}
          host: ${HOSTNAME}
          server_ip: ${SERVER_IP}
          job: syslog
          __path__: /var/log/syslog

  - job_name: kern
    static_configs:
      - targets: [localhost]
        labels:
          instansi: ${ORG_LABEL}
          host: ${HOSTNAME}
          server_ip: ${SERVER_IP}
          job: kern
          __path__: /var/log/kern.log

  - job_name: nginx
    static_configs:
      - targets: [localhost]
        labels:
          instansi: ${ORG_LABEL}
          host: ${HOSTNAME}
          server_ip: ${SERVER_IP}
          job: nginx
          __path__: /var/log/nginx/*.log

  - job_name: nginx-access
    static_configs:
      - targets: [localhost]
        labels:
          instansi: ${ORG_LABEL}
          host: ${HOSTNAME}
          server_ip: ${SERVER_IP}
          job: nginx-access
          __path__: /var/log/nginx/*access.log

  - job_name: laravel
    static_configs:
      - targets: [localhost]
        labels:
          instansi: ${ORG_LABEL}
          host: ${HOSTNAME}
          server_ip: ${SERVER_IP}
          job: laravel
          __path__: /www/wwwroot/*/storage/logs/*.log

  - job_name: custom-nginx
    static_configs:
      - targets: [localhost]
        labels:
          instansi: ${ORG_LABEL}
          host: ${HOSTNAME}
          server_ip: ${SERVER_IP}
          job: custom-nginx
          __path__: /opt/webpanel/nginx/logs/*.log
