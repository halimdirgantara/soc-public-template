# Contoh aturan WAF yang dipasang di dalam setiap blok server{} nginx.
# Pasangkan dengan waf-traversal.example.conf (map) di dalam http{}.
#
# $soc_bad_args : pola traversal / null-byte pada query string
# $soc_block_ip : daftar IP yang diblokir (memakai IP asli setelah real_ip)

if ($soc_bad_args) { return 403; }
if ($soc_block_ip) { return 403; }
