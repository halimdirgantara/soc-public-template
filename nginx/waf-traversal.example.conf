# Contoh WAF ringan: traversal & null-byte pada query string, plus daftar blokir IP.
# Taruh berkas ini di include http{} nginx.
#
# Kolom daftar blokir memakai $remote_addr — nilainya sudah ditulis ulang oleh
# modul real_ip (lihat real-ip.example.conf) ketika trafik datang dari reverse
# proxy/CDN. JANGAN memakai $http_cf_connecting_ip untuk map ini: variabel itu
# tidak terbaca saat `if` dievaluasi sehingga blokir tidak pernah aktif.

map $args $soc_bad_args {
    default 0;
    "~*(\.\.|%2e%2e)(/|%2f)|%00|/etc/passwd|/proc/self|win\.ini|boot\.ini|%252e" 1;
}

map $remote_addr $soc_block_ip {
    default 0;
    # 203.0.113.10 1;   # contoh dokumentasi (RFC 5737)
}
